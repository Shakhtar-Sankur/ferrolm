<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Throughput: the same 64 requests, three ways">
<rect width="720" height="260" rx="8" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Throughput: the same 64 requests, three ways</text>
<text x="24" y="56" font-size="13" fill="#52514e">Output tokens per second; prompts of 32-256 tokens, replies of 16-256, all queued at once</text>
<line x1="170.0" y1="74" x2="170.0" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="170.0" y="218" font-size="12" fill="#52514e" text-anchor="middle">0</text>
<line x1="243.3" y1="74" x2="243.3" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="243.3" y="218" font-size="12" fill="#52514e" text-anchor="middle">20</text>
<line x1="316.7" y1="74" x2="316.7" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="316.7" y="218" font-size="12" fill="#52514e" text-anchor="middle">40</text>
<line x1="390.0" y1="74" x2="390.0" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="390.0" y="218" font-size="12" fill="#52514e" text-anchor="middle">60</text>
<line x1="463.3" y1="74" x2="463.3" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="463.3" y="218" font-size="12" fill="#52514e" text-anchor="middle">80</text>
<line x1="536.7" y1="74" x2="536.7" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="536.7" y="218" font-size="12" fill="#52514e" text-anchor="middle">100</text>
<line x1="610.0" y1="74" x2="610.0" y2="200" stroke="#e4e3df" stroke-width="1"/>
<text x="610.0" y="218" font-size="12" fill="#52514e" text-anchor="middle">120</text>
<path d="M170,88.0 h121.2 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-121.2 z" fill="#9ec5f4"><title>One at a time: 34 tok/s</title></path>
<text x="158" y="104.0" font-size="13" fill="#0b0b0b" text-anchor="end">One at a time</text>
<text x="303.2" y="104.0" font-size="13" font-weight="600" fill="#0b0b0b">34 <tspan font-weight="400" fill="#52514e">tok/s</tspan></text>
<path d="M170,128.0 h368.4 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-368.4 z" fill="#9ec5f4"><title>Static batching: 102 tok/s</title></path>
<text x="158" y="144.0" font-size="13" fill="#0b0b0b" text-anchor="end">Static batching</text>
<text x="550.4" y="144.0" font-size="13" font-weight="600" fill="#0b0b0b">102 <tspan font-weight="400" fill="#52514e">tok/s</tspan></text>
<path d="M170,168.0 h418.9 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-418.9 z" fill="#2a78d6"><title>Continuous batching: 115 tok/s</title></path>
<text x="158" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end">Continuous batching</text>
<text x="600.9" y="184.0" font-size="13" font-weight="600" fill="#0b0b0b">115 <tspan font-weight="400" fill="#52514e">tok/s</tspan></text>
<text x="24" y="244" font-size="12" fill="#52514e">SmolLM2-360M-Instruct, bf16 weights; 4 vCPUs (Xeon, AVX-512). Replies of fixed length.</text>
</svg>