[package]
name = "ferrolm"
version = "0.1.0"
edition = "2024"
description = "An LLM inference server in Rust, from scratch: paged KV cache, continuous batching, prefix caching and speculative decoding, with batch-invariant kernels"
license = "Apache-2.0"
repository = "https://github.com/Shakhtar-Sankur/ferrolm"

[dependencies]

[profile.release]
debug = false
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.test]
opt-level = 3
